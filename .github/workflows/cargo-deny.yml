name: Cargo-deny Check

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Run cargo-deny
        run: cargo deny --log-level warn --all-features check
