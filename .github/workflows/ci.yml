name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.png'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.png'

env:
  TOOLCHAIN_PROFILE: minimal
  CARGO_TERM_COLOR: always

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        id: toolchain
        env:
          TOOLCHAIN: ${{ matrix.channel }}
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile "$TOOLCHAIN_PROFILE" --target "$TARGET" --component rustfmt,clippy
          rustup override set "$TOOLCHAIN"
          echo "rustc=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Install 32-bit MinGW linker
        if: matrix.target == 'i686-pc-windows-gnu'
        run: |
          # Restart MSYS2 after its runtime update before updating packages.
          C:/msys64/usr/bin/bash.exe -lc 'pacman -Syu --noconfirm'
          C:/msys64/usr/bin/bash.exe -lc 'pacman -Syu --noconfirm'
          C:/msys64/usr/bin/bash.exe -lc 'pacman -S --noconfirm --needed mingw-w64-i686-gcc'
          echo 'C:/msys64/mingw32/bin' >> "$GITHUB_PATH"
          echo 'CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=C:/msys64/mingw32/bin/gcc.exe' >> "$GITHUB_ENV"
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
      - name: Run cargo fmt
        if: matrix.channel == 'nightly'
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        if: matrix.channel == 'nightly'
        run: cargo clippy --locked -- -D warnings
      - name: Run cargo check with no default features
        env:
          TARGET: ${{ matrix.target }}
        run: cargo check --locked --target "$TARGET" --no-default-features
      - env:
          CHANNEL: ${{ matrix.channel }}
          CROSS: ${{ !startsWith(matrix.target, 'x86_64') && contains(matrix.target, 'linux') && '1' || '0' }}
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          PROJECT_DIR: ${{ github.workspace }}
        run: sh .github/workflows/ci.sh

    strategy:
      fail-fast: false
      matrix:
        target: [
          x86_64-unknown-linux-gnu,
#          i686-unknown-linux-gnu,
          aarch64-unknown-linux-gnu,
          armv7-unknown-linux-gnueabihf,
          riscv64gc-unknown-linux-gnu, 
          s390x-unknown-linux-gnu,
          loongarch64-unknown-linux-gnu,
#          mips64-unknown-linux-muslabi64,

          x86_64-apple-darwin,
          aarch64-apple-darwin,

          x86_64-pc-windows-gnu,
          x86_64-pc-windows-msvc,
          i686-pc-windows-gnu,
          i686-pc-windows-msvc,
        ]
        channel: [stable, nightly]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
#          Disable i686 tests until https://github.com/bytedance/monoio/issues/285 addressed.
#          - target: i686-unknown-linux-gnu
#            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu 
            os: ubuntu-latest
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
          - target: loongarch64-unknown-linux-gnu
            os: ubuntu-latest
#          - target: mips64-unknown-linux-muslabi64
#            os: ubuntu-latest

          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-14

          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-pc-windows-gnu
            os: windows-latest
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: i686-pc-windows-gnu
            os: windows-latest
